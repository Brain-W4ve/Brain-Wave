version: '3.8'

services:
  # 📌 MinIO (Almacenamiento de objetos)
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"  # MinIO API port
      - "9001:9001"  # MinIO Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./minio/data:/data  # Use a bind mount to store data in ./data on your host

  # # 📌 PostgreSQL (Base de Datos)
  # database:
  #   image: postgres:15
  #   container_name: postgres_db
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: user
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: mydb
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  # 📌 Backend (Flask + Alembic + PostgreSQL)
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - database
      - minio
    environment:
      DATABASE_URL: postgresql://user:password@database:5432/mydb
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: ["sh", "-c", "sleep 5 && alembic upgrade head && python app.py"]

  # 📌 Frontend (React + SChart)
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend