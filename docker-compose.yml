version: '3.8'

services:
  backend:
    build:
      context: ./backend  # Set the build context to the backend directory
      dockerfile: Dockerfile  # Specify the Dockerfile within the backend directory
    container_name: backend-container
    ports:
      - "5000:5000"
    # environment:
    #   # DATABASE_URL: postgresql://user:password@database:5432/mydb
    #   FLASK_APP: src.app
    #   FLASK_ENV: development
    #   MINIO_ENDPOINT: minio:9000
    #   MINIO_ACCESS_KEY: minioadmin
    #   MINIO_SECRET_KEY: minioadmin
    env_file:
      - ./backend/.env
    depends_on:
      - minio
    networks:
      - brain-wave-network

  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
  
  ai_models:
    build:
      context: ./ai_models
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - backend
    
  
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"  # MinIO API port
      - "9001:9001"  # MinIO Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./data:/data  # Use a bind mount to store data in ./data on your host
    networks:
      - brain-wave-network

networks:
  brain-wave-network:
    driver: bridge
