version: '3.8'

services:
  backend:
    build:
      context: ./backend  
      dockerfile: Dockerfile  
    container_name: backend-container
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - minio
    networks:
      - brain-wave-network
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
  
  ai_models:
    build:
      context: ./ai_models
      dockerfile: Dockerfile
    env_file:
      - ./ai_models/.env
    ports:
      - "5001:50051"
    networks:
      - brain-wave-network
  
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"  # MinIO API port
      - "9001:9001"  # MinIO Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./data:/data  
    networks:
      - brain-wave-network

networks:
  brain-wave-network:
    driver: bridge
